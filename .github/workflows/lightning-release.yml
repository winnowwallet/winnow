name: Lightning release

# Winnow Lightning (com.btcswift.lightning, its own TestFlight app) from a
# `lightning-v*.*.*` tag. CI must pass for the tagged tree first; the build is
# then archived, verified, uploaded, given its What to Test notes and added to
# the app's internal group. It never creates the app or opens public testing.
#
# Export compliance is the account holder's declaration. With the repository
# variable LIGHTNING_NONEXEMPT_ENCRYPTION unset (PENDING), the build carries no
# encryption key so App Store Connect asks its questionnaire; answer it there,
# then set the variable (YES with LIGHTNING_ENCRYPTION_COMPLIANCE_CODE, or NO).
on:
  push:
    tags: ["lightning-v*.*.*"]

permissions:
  contents: read
  actions: read

concurrency:
  group: lightning-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  testflight:
    if: ${{ !cancelled() && needs.ci.result == 'success' }}
    needs: ci
    runs-on: macos-26
    timeout-minutes: 120
    env:
      TESTFLIGHT_BUNDLE_ID: com.btcswift.lightning
      TESTFLIGHT_WHATS_NEW_FILE: docs/lightning-what-to-test.txt
      LIGHTNING_NONEXEMPT_ENCRYPTION: ${{ vars.LIGHTNING_NONEXEMPT_ENCRYPTION || 'PENDING' }}
      LIGHTNING_ENCRYPTION_COMPLIANCE_CODE: ${{ vars.LIGHTNING_ENCRYPTION_COMPLIANCE_CODE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Earlier research uploads used builds up to 9; start well above them.
      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#lightning-v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag must be lightning-vX.Y.Z"; exit 1; }
          BUILD=$((100 + GITHUB_RUN_NUMBER))
          sed -i '' "s/MARKETING_VERSION: \"0.1.0\"/MARKETING_VERSION: \"$VERSION\"/" project.yml
          sed -i '' "s/CURRENT_PROJECT_VERSION: \"1\"/CURRENT_PROJECT_VERSION: \"$BUILD\"/" project.yml
          printf 'TESTFLIGHT_MARKETING_VERSION=%s\n' "$VERSION" >> "$GITHUB_ENV"
          printf 'TESTFLIGHT_BUILD_NUMBER=%s\n' "$BUILD" >> "$GITHUB_ENV"

      - name: Apply the reviewed encryption declaration
        run: python3 scripts/lightning-encryption-declaration project.yml

      - name: Python with standard TOML support
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install pinned XcodeGen
        run: scripts/install-xcodegen

      - name: Generate Xcode project
        run: xcodegen

      - name: Prepare signing credentials
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: scripts/ci-sign.sh

      # See release.yml: one persistent certificate, so Xcode never mints more.
      - name: Import the persistent development certificate
        env:
          DEV_CERT_P12: ${{ secrets.DEV_CERT_P12 }}
          DEV_CERT_P12_PASSWORD: ${{ secrets.DEV_CERT_P12_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/winnow-ci.keychain-db"
          KCPW="$(uuidgen)"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          printf '%s' "$DEV_CERT_P12" | base64 -D > "$RUNNER_TEMP/dev.p12"
          security import "$RUNNER_TEMP/dev.p12" -k "$KC" -P "$DEV_CERT_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm "$RUNNER_TEMP/dev.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" login.keychain
          security find-identity -p codesigning "$KC" | head -3

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: >-
          xcodebuild -project WinnowApp.xcodeproj -scheme WinnowLightning
          -configuration Release -destination 'generic/platform=iOS'
          -archivePath build/WinnowLightning.xcarchive
          -derivedDataPath build/DerivedData
          -allowProvisioningUpdates
          -authenticationKeyPath "${RUNNER_TEMP}/winnow-signing/AuthKey.p8"
          -authenticationKeyID "$ASC_KEY_ID"
          -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          -skipPackagePluginValidation -skipMacroValidation archive

      - name: Verify the archive excludes E2E controls
        run: scripts/verify-release-e2e-exclusion build/WinnowLightning.xcarchive/Products/Applications/WinnowLightning.app

      - name: Verify the signed identity, no iCloud and the encryption declaration
        run: scripts/verify-signed-archive build/WinnowLightning.xcarchive/Products/Applications/WinnowLightning.app

      - name: Verify archive dependency resolution
        run: scripts/check-dependencies --xcode build/DerivedData

      - name: Export the App Store distribution package
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > build/ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>2858MX5336</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath build/WinnowLightning.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${RUNNER_TEMP}/winnow-signing/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -skipPackagePluginValidation -skipMacroValidation

      - name: Verify the exported package
        run: scripts/verify-exported-ipa build/export/WinnowLightning.ipa

      - name: Generate SBOM and app build provenance
        run: >-
          scripts/generate-supply-chain-metadata
          --output-dir build/supply-chain
          --subject build/export/WinnowLightning.ipa
          --subject-name WinnowLightning.ipa
          --builder-id https://github.com/${{ github.repository }}/.github/workflows/lightning-release.yml@${{ github.workflow_sha }}

      - name: Keep supply-chain metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lightning-supply-chain-${{ github.run_id }}
          path: build/supply-chain/
          if-no-files-found: error
          retention-days: 30

      - name: Upload the verified package to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          API_PRIVATE_KEYS_DIR: ${{ runner.temp }}/winnow-signing
        run: |
          shasum -a 256 -c build/export/WinnowLightning.ipa.verified.sha256
          ln -s AuthKey.p8 "$API_PRIVATE_KEYS_DIR/AuthKey_${ASC_KEY_ID}.p8"
          xcrun altool --upload-app -f build/export/WinnowLightning.ipa -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Notes and internal testing
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/winnow-signing/AuthKey.p8
        run: |
          scripts/testflight.sh wait-processing
          scripts/testflight.sh notes
          if [[ "$LIGHTNING_NONEXEMPT_ENCRYPTION" == PENDING ]]; then
            scripts/testflight.sh internal || {
              echo "::notice::Uploaded $TESTFLIGHT_MARKETING_VERSION ($TESTFLIGHT_BUILD_NUMBER). Answer the export compliance questions for this build in App Store Connect to make it testable."
            }
          else
            scripts/testflight.sh internal
          fi

      - name: Remove App Store Connect key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/winnow-ci.keychain-db" || true
          rm -f "$RUNNER_TEMP/dev.p12"
          find "${RUNNER_TEMP}/winnow-signing" -maxdepth 1 -name 'AuthKey*.p8' -delete
          rmdir "${RUNNER_TEMP}/winnow-signing" 2>/dev/null || true
