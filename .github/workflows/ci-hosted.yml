name: Hosted CI fallback
on:
  workflow_call:
    outputs:
      website-artifact:
        value: ${{ jobs.build.outputs.website-artifact }}
      deployment-branch:
        value: ${{ jobs.build.outputs.deployment-branch }}

permissions:
  contents: read
  actions: read

jobs:
  build:
    # One Mac job owns package checks, the app, the node, and website output.
    # Every run gets a fresh hosted Apple silicon Mac. Forks skip the node fixture
    # and deployment credentials, but still run the package and app unit tests.
    runs-on: macos-26
    timeout-minutes: 60
    outputs:
      website-artifact: ${{ steps.site.outputs.artifact }}
      deployment-branch: ${{ steps.site.outputs.branch }}
    defaults:
      run:
        shell: bash --noprofile --norc -e -o pipefail {0}
    env:
      RUN_UI_JOURNEY: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      WINNOW_NODE_HOST: '127.0.0.1'
      WINNOW_P2P_PORT: '38601'
      WINNOW_RPC_PORT: '38600'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prepare fresh evidence and shared build directory
        run: |
          CI_RESULTS=$(mktemp -d "$RUNNER_TEMP/winnow-ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-XXXXXX")
          echo "CI_RESULTS=$CI_RESULTS" >> "$GITHUB_ENV"
          echo "APP_RESULTS=$CI_RESULTS/app" >> "$GITHUB_ENV"
          mkdir -p "$CI_RESULTS/app"
          echo "DERIVED_DATA=$CI_RESULTS/app-build" >> "$GITHUB_ENV"
          test "$(uname -m)" = arm64

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Reuse tested journey media when only the website changed
        id: cache
        if: env.RUN_UI_JOURNEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-journey-cache

      - name: Download the matching journey media
        id: media
        continue-on-error: true
        if: steps.cache.outputs.reuse == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ steps.cache.outputs.artifact-name }}
          run-id: ${{ steps.cache.outputs.run-id }}
          github-token: ${{ github.token }}
          path: ${{ env.CI_RESULTS }}/reused-media

      - name: Validate downloaded journey media
        id: validate_media
        continue-on-error: true
        if: steps.media.outcome == 'success'
        run: |
          if ! scripts/prepare-site-artifact --validate-media "$CI_RESULTS/reused-media"; then
            echo 'Downloaded media failed validation; running fresh wallet tests and recording.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Check website, artifact reuse and release tooling
        run: |
          python3 -m unittest discover -s scripts/tests -p test_ci_journey_cache.py
          python3 -m unittest discover -s scripts/tests -p test_build_site.py
          python3 -m unittest discover -s scripts/tests -p test_prepare_site_artifact.py
          python3 -m unittest discover -s scripts/tests -p test_appstore_status.py
          python3 -m unittest discover -s scripts/tests -p test_release_policy.py

      - name: Complexity budget and test gates
        if: steps.validate_media.outcome != 'success'
        run: |
          command -v swiftlint >/dev/null || brew install swiftlint
          swiftlint lint --quiet
          scripts/check-test-gates

      - name: Prepare fresh journey tools
        if: steps.validate_media.outcome != 'success' && env.RUN_UI_JOURNEY == 'true'
        run: |
          command -v bitcoind >/dev/null || brew install bitcoin
          command -v ffmpeg >/dev/null || brew install ffmpeg
          sw_vers
          xcodebuild -version
          bitcoin-cli --version | head -1

      - name: Package and debugging tool tests
        if: steps.validate_media.outcome != 'success'
        run: |
          scripts/check-dependencies
          swift test
          scripts/ci-debug

      - name: Release-build production package and reject first-party warnings
        if: steps.validate_media.outcome != 'success'
        run: >-
          scripts/ci-production-warnings
          "$CI_RESULTS/production-build"
          "$CI_RESULTS/production-build.log"

      - name: Exercise release debugging commands
        if: steps.validate_media.outcome != 'success'
        run: |
          "$CI_RESULTS/production-build/release/winnow-debug" inspect --help
          "$CI_RESULTS/production-build/release/winnow-debug" generate --help
          "$CI_RESULTS/production-build/release/winnow-debug" soak --help

      - name: Generate deterministic SBOM and build provenance
        if: steps.validate_media.outcome != 'success'
        run: |
          scripts/generate-supply-chain-metadata \
            --output-dir "$CI_RESULTS/supply-chain" \
            --subject "$CI_RESULTS/production-build/release/winnow-debug" \
            --subject-name winnow-debug \
            --builder-id "https://github.com/${{ github.repository }}/.github/workflows/ci.yml@${{ github.workflow_sha }}"
          scripts/generate-supply-chain-metadata \
            --output-dir "$CI_RESULTS/supply-chain-replay" \
            --subject "$CI_RESULTS/production-build/release/winnow-debug" \
            --subject-name winnow-debug \
            --builder-id "https://github.com/${{ github.repository }}/.github/workflows/ci.yml@${{ github.workflow_sha }}"
          diff -ru "$CI_RESULTS/supply-chain" "$CI_RESULTS/supply-chain-replay"

      - name: Upload build log, SBOM, and provenance
        if: always() && steps.validate_media.outcome != 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-supply-chain-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.CI_RESULTS }}/production-build.log
            ${{ env.CI_RESULTS }}/supply-chain/
          if-no-files-found: warn
          retention-days: 14

      # The development harness exercises the local Bitcoin modules.
      # Deliberately a FIXED seed, unlike the sustained lane. This is the
      # regression evidence: every pull request fuzzes the identical 15,000
      # cases, so a newly-introduced parser bug shows up as this job turning
      # red rather than as a corpus that happened to wander somewhere new.
      # Rotation belongs in the scheduled lane; do not "fix" this one too.
      - name: Bounded deterministic fuzz smoke
        if: steps.validate_media.outcome != 'success'
        run: |
          mkdir -p "$CI_RESULTS/fuzz-smoke"
          set -o pipefail
          swift run --scratch-path "$CI_RESULTS/production-build" \
            --configuration release WinnowFuzz \
            --iterations 1000 \
            --seed 0x57494e4e4f575055 \
            --max-input 16384 \
            --artifact-dir "$CI_RESULTS/fuzz-smoke" \
            2>&1 | tee "$CI_RESULTS/fuzz-smoke/run.log"

      - name: Upload fuzz log and reproducer
        if: always() && steps.validate_media.outcome != 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CI_RESULTS }}/fuzz-smoke/
          if-no-files-found: warn
          retention-days: 7

      - name: Install pinned XcodeGen
        if: steps.validate_media.outcome != 'success'
        run: scripts/install-xcodegen

      - name: Generate project and choose the shared iPhone simulator
        if: steps.validate_media.outcome != 'success'
        run: |
          xcodegen
          echo "SIMULATOR_ID=$(scripts/ios-simulator iPhone)" >> "$GITHUB_ENV"

      # Unfiltered: the scheme builds the app and BOTH test runners once.
      # The following test-without-building calls select their own target.
      - name: Build Debug app and test runners once
        if: steps.validate_media.outcome != 'success'
        run: |
          xcodebuild build-for-testing -project WinnowApp.xcodeproj -scheme WinnowApp \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$DERIVED_DATA" \
            -skipPackagePluginValidation -skipMacroValidation \
            2>&1 | tee "$APP_RESULTS/debug-build.log"

      - name: App unit tests (required)
        if: steps.validate_media.outcome != 'success'
        run: scripts/ci-app-tests "$APP_RESULTS/units" --skip-build

      - name: Verify resolved Debug dependencies
        if: steps.validate_media.outcome != 'success'
        run: scripts/check-dependencies --xcode "$DERIVED_DATA"

      # Prepare the disposable chain and funding before the UI step's clock.
      # Every run starts from genesis without workstation data or a snapshot.
      - name: Start the trusted run's isolated signet fixture
        if: steps.validate_media.outcome != 'success' && env.RUN_UI_JOURNEY == 'true'
        timeout-minutes: 5
        run: |
          export WINNOW_DATADIR="$APP_RESULTS/winnow-signet-fixture"
          echo "WINNOW_DATADIR=$WINNOW_DATADIR" >> "$GITHUB_ENV"
          command -v bitcoin-util
          test ! -e "$WINNOW_DATADIR"
          for port in "$WINNOW_RPC_PORT" "$WINNOW_P2P_PORT"; do
            if nc -z -G 1 "$WINNOW_NODE_HOST" "$port"; then
              echo "::error::fixture port $port is already occupied"
              exit 1
            fi
          done
          scripts/signet-fixture up
          bitcoin-cli -datadir="$WINNOW_DATADIR" -rpcport="$WINNOW_RPC_PORT" getblockchaininfo \
            | python3 -c 'import json,sys; info=json.load(sys.stdin); assert info["chain"] == "signet", "expected the signet fixture"; print("fixture at height", info["blocks"])'
          mkdir -p "$APP_RESULTS/journey/node-screenshots"
          swift run winnow-fixture prepare-bank \
            2>&1 | tee "$APP_RESULTS/journey/bank-setup.log"
          {
            echo "WINNOW_NODE_HOST=$WINNOW_NODE_HOST"
            echo "WINNOW_P2P_PORT=$WINNOW_P2P_PORT"
            echo "WINNOW_RPC_PORT=$WINNOW_RPC_PORT"
            echo "WINNOW_DATADIR=$WINNOW_DATADIR"
            echo "WINNOW_SCREENSHOT_DIR=$APP_RESULTS/journey/node-screenshots"
          } > "$HOME/.winnow-node.env"

      - name: Recorded signet UI journey
        if: steps.validate_media.outcome != 'success' && env.RUN_UI_JOURNEY == 'true'
        timeout-minutes: 15
        run: scripts/ci-ui-journey "$APP_RESULTS/journey" --skip-build

      - name: Stop the trusted run's simulator and fixture
        if: always() && steps.validate_media.outcome != 'success' && env.RUN_UI_JOURNEY == 'true'
        run: |
          xcrun simctl shutdown all || true
          pkill -f WinnowAppUITests-Runner || true
          rm -f "$HOME/.winnow-node.env"
          if [[ -n "${WINNOW_DATADIR:-}" && -f "$WINNOW_DATADIR/bitcoin.conf" ]]; then
            scripts/signet-fixture down
          fi

      - name: Build and inspect release app
        if: steps.validate_media.outcome != 'success'
        run: |
          xcodebuild -project WinnowApp.xcodeproj -scheme WinnowApp \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$CI_RESULTS/release" \
            -skipPackagePluginValidation -skipMacroValidation \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build \
            2>&1 | tee "$APP_RESULTS/release-build.log"
          scripts/check-dependencies --xcode "$CI_RESULTS/release"
          scripts/check-swift-warnings "$APP_RESULTS/release-build.log"
          scripts/verify-release-e2e-exclusion \
            "$CI_RESULTS/release/Build/Products/Release-iphonesimulator/WinnowApp.app"

      - name: Upload app results
        if: always() && steps.validate_media.outcome != 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.APP_RESULTS }}/debug-build.log
            ${{ env.APP_RESULTS }}/units/
            ${{ env.APP_RESULTS }}/journey/
            ${{ env.APP_RESULTS }}/release-build.log
          if-no-files-found: error
          retention-days: 14

      - name: Prepare the website artifact
        id: site
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git lfs pull
          media=()
          if [[ '${{ steps.validate_media.outcome }}' == success ]]; then
            media=(--media "$CI_RESULTS/reused-media" --media-output "$CI_RESULTS/journey-media")
          elif [[ "$RUN_UI_JOURNEY" == true ]]; then
            media=(--journey "$APP_RESULTS/journey" --media-output "$CI_RESULTS/journey-media")
          fi
          scripts/prepare-site-artifact "$CI_RESULTS/site" "${media[@]}"
          echo "artifact=website-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            echo 'branch=main' >> "$GITHUB_OUTPUT"
          elif [[ -n "$PR_NUMBER" ]]; then
            echo "branch=pr-$PR_NUMBER" >> "$GITHUB_OUTPUT"
          else
            echo "branch=preview-$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          fi

      - name: Save reusable journey media
        if: steps.validate_media.outcome != 'success' && env.RUN_UI_JOURNEY == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: journey-media-${{ steps.cache.outputs.fingerprint }}
          overwrite: true
          path: ${{ env.CI_RESULTS }}/journey-media/
          if-no-files-found: error
          retention-days: 30

      - name: Upload the tested website
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.site.outputs.artifact }}
          path: ${{ env.CI_RESULTS }}/site/
          if-no-files-found: error
          retention-days: 14
