name: CI
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      hosted:
        description: Use the hosted fallback
        type: boolean
        default: false
  workflow_call:
permissions:
  contents: read
  actions: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  hosted:
    if: vars.TDX_CI_ENABLED != 'true' || inputs.hosted == true || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
    uses: ./.github/workflows/ci-hosted.yml
  tdx:
    if: vars.TDX_CI_ENABLED == 'true' && inputs.hosted != true && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/ci-tdx.yml
  website:
    needs: [hosted, tdx]
    # Keep deployment secrets outside every validation workflow and guest.
    # Explicit status handling also permits intentionally skipped reuse lanes.
    if: ${{ !cancelled() && (needs.hosted.result == 'success' || needs.tdx.result == 'success') && (github.workflow == 'CI' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.ref == 'refs/heads/main' && github.event_name != 'schedule') || github.event_name == 'workflow_dispatch')) }}
    uses: ./.github/workflows/site.yml
    with:
      artifact-name: ${{ needs.tdx.outputs.website-artifact || needs.hosted.outputs.website-artifact }}
      deployment-branch: ${{ needs.tdx.outputs.deployment-branch || needs.hosted.outputs.deployment-branch }}
    secrets:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
  validation:
    if: always()
    needs: [hosted, tdx, website]
    runs-on: ubuntu-24.04
    steps:
      - env:
          HOSTED: ${{ needs.hosted.result }}
          TDX: ${{ needs.tdx.result }}
          WEBSITE: ${{ needs.website.result }}
          DEPLOY: ${{ github.workflow == 'CI' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.ref == 'refs/heads/main' && github.event_name != 'schedule') || github.event_name == 'workflow_dispatch') }}
        run: |
          [[ "$HOSTED:$TDX" == success:skipped || "$HOSTED:$TDX" == skipped:success ]] || exit 1
          if [[ "$DEPLOY" == true ]]; then
            [[ "$WEBSITE" == success ]] || exit 1
          else
            [[ "$WEBSITE" == skipped ]] || exit 1
          fi
