name: CI
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      hosted:
        description: Use the hosted fallback
        type: boolean
        default: false
  workflow_call:
permissions:
  contents: read
  actions: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  hosted:
    if: vars.TDX_CI_ENABLED != 'true' || inputs.hosted == true || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
    uses: ./.github/workflows/ci-hosted.yml
    secrets: inherit
  tdx:
    if: vars.TDX_CI_ENABLED == 'true' && inputs.hosted != true && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/ci-tdx.yml
    secrets: inherit
  validation:
    if: always()
    needs: [hosted, tdx]
    runs-on: ubuntu-24.04
    steps:
      - env:
          HOSTED: ${{ needs.hosted.result }}
          TDX: ${{ needs.tdx.result }}
        run: |
          [[ "$HOSTED:$TDX" == success:skipped || "$HOSTED:$TDX" == skipped:success ]]
