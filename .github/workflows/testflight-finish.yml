name: TestFlight finish

# Finishes a release whose upload already succeeded.
#
# release.yml does archive → upload → wait for App Store Connect → assign
# TestFlight groups in one job, so if Apple's ingest is slow the run fails
# holding a perfectly good uploaded build. Re-running is not an option: the
# build number is the workflow run number, and Apple rejects a duplicate.
#
# This runs only the part that failed, against a build already in ASC.

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "Version as it appears in TestFlight, e.g. 0.2.0"
        required: true
      build_number:
        description: "Build number, i.e. the run number of the release that uploaded it"
        required: true

permissions:
  contents: read

env:
  ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
  ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
  ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}

jobs:
  finish:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare signing credentials
        run: scripts/ci-sign.sh

      - name: TestFlight groups (internal + external)
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/winnow-signing/AuthKey.p8
          TESTFLIGHT_MARKETING_VERSION: ${{ inputs.marketing_version }}
          TESTFLIGHT_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          chmod +x scripts/testflight.sh
          scripts/testflight.sh wait-processing
          scripts/testflight.sh notes
          scripts/testflight.sh internal
          scripts/testflight.sh external
