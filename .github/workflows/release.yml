name: Lightning TestFlight preflight
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lightning-testflight-preflight
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Read existing research app with existing CI credentials
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/lightning-asc/AuthKey.p8
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/lightning-asc"
          printf '%s' "$ASC_PRIVATE_KEY" > "$ASC_KEY_PATH"
          python3 scripts/lightning-asc-preflight.py
      - name: Preserve credential-free preflight report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lightning-asc-preflight
          path: control-output/app-state.json
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary API key
        if: always()
        run: rm -f "$RUNNER_TEMP/lightning-asc/AuthKey.p8"
