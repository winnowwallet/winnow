name: TestFlight feedback

# Pulls TestFlight feedback (comments, screenshots and crash logs) and encrypts
# it to the age recipient given at dispatch. This repository is public, so the
# log shows counts only and the artifact is unreadable without the recipient's
# private key.
on:
  workflow_dispatch:
    inputs:
      recipient:
        description: "age public key (age1…) to encrypt the feedback to"
        required: true
      limit:
        description: "Newest submissions of each kind, 1-200"
        default: "50"

permissions:
  contents: read

concurrency:
  group: testflight-feedback
  cancel-in-progress: false

jobs:
  pull:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      RECIPIENT: ${{ inputs.recipient }}
      LIMIT: ${{ inputs.limit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate inputs
        run: |
          [[ "$RECIPIENT" =~ ^age1[qpzry9x8gf2tvdw0s3jn54khce6mua7l]{58}$ ]] || { echo "::error::recipient must be an age X25519 public key"; exit 1; }
          [[ "$LIMIT" =~ ^[0-9]{1,3}$ ]] && (( LIMIT >= 1 && LIMIT <= 200 )) || { echo "::error::limit must be 1-200"; exit 1; }

      - name: Install age
        run: brew install age

      - name: Pull and encrypt feedback
        run: |
          umask 077
          work="$RUNNER_TEMP/feedback"
          mkdir -p "$work"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8" python3 scripts/testflight-feedback "$work/out" --limit "$LIMIT"
          tar -C "$work" -czf "$work/feedback.tgz" out
          age -r "$RECIPIENT" -o "$RUNNER_TEMP/testflight-feedback.tgz.age" "$work/feedback.tgz"
          rm -rf "$work"

      - name: Keep the encrypted feedback for three days
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testflight-feedback-${{ github.run_id }}
          path: ${{ runner.temp }}/testflight-feedback.tgz.age
          if-no-files-found: error
          retention-days: 3

      - name: Remove App Store Connect key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
