name: Node integration

# Each job owns a disposable custom signet inside its runner VM. Code changes
# run Core comparisons and app journeys; identical, successful PR evidence can
# cover the resulting main push. Nightly, release and confirmed manual runs
# always execute fresh checks. Forks never reach the runner. Mining suites
# stay serial within each VM: one listener and one job at a time.
#
# Pull requests reach the node lane only when they target main: a stacked
# PR re-runs the same tree its base is already running. `edited` is listened
# to solely so that retargeting a stacked PR to main, once its base merges,
# triggers the run it now needs; every job ignores an edit that changed
# only the title or body.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      confirm_dedicated_fixture:
        description: Run differential and UI suites on the disposable node fixture
        required: true
        type: boolean
        default: false
  workflow_call:
    inputs:
      confirm_dedicated_fixture:
        required: true
        type: boolean

defaults:
  run:
    shell: bash --noprofile --norc -e -o pipefail {0}

permissions:
  contents: read

# Superseded PR runs are cancelled. Separate VMs can run different jobs;
# each VM has one listener so simulator and fixture cleanup cannot overlap.
concurrency:
  group: node-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WINNOW_NODE_HOST: '127.0.0.1'
  WINNOW_P2P_PORT: '38601'
  WINNOW_RPC_PORT: '38600'

jobs:
  # A job skipped by `if:` reports success, so a docs-only change passes
  # without touching the seat; a workflow-level paths filter would instead
  # leave a required check at "Expected" forever.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      required: ${{ steps.select.outputs.required }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Check CI selection rules
        run: python3 -m unittest discover -s scripts/tests -p test_ci_required.py
      - id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-required node-tests

  differential:
    needs: changes
    if: >-
      needs.changes.outputs.required == 'true'
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && (github.event_name != 'pull_request' || github.event.pull_request.base.ref == 'main')
      && (github.event.action != 'edited' || github.event.changes.base != null)
      && (contains('pull_request push schedule', github.event_name) || inputs.confirm_dedicated_fixture)
    runs-on: [self-hosted, macOS, btc-swift, node-e2e]
    # First measured run under this lane: 5 m 20 s (run 34056640602).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Sweep a fixture left by an interrupted run
        run: |
          pkill -f 'bitcoind -datadir=.*/winnow-signet-' || true
          RESULTS_DIR=$(mktemp -d "$RUNNER_TEMP/winnow-evidence-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB-XXXXXX")
          echo "RESULTS_DIR=$RESULTS_DIR" >> "$GITHUB_ENV"
          echo "WINNOW_DATADIR=$RESULTS_DIR/winnow-signet-fixture" >> "$GITHUB_ENV"

      - name: Start this run's isolated fixture
        run: |
          command -v bitcoind
          command -v bitcoin-cli
          command -v bitcoin-util
          test ! -e "$WINNOW_DATADIR"
          for port in "$WINNOW_RPC_PORT" "$WINNOW_P2P_PORT"; do
            if nc -z -G 1 "$WINNOW_NODE_HOST" "$port"; then
              echo "::error::fixture port $port is already occupied"
              exit 1
            fi
          done
          scripts/signet-fixture up
          bitcoin-cli -datadir="$WINNOW_DATADIR" -rpcport="$WINNOW_RPC_PORT" getblockchaininfo \
            | python3 -c 'import json,sys; info=json.load(sys.stdin); assert info["chain"] == "signet" and info["blocks"] == 0, "expected a fresh signet fixture"'

      # The build lives in the checkout's .build, which the runner keeps
      # between jobs; a scratch path under RUNNER_TEMP is wiped every run.
      - name: Differential tests
        env:
          WINNOW_DIFF: '1'
        run: |
          set -o pipefail
          swift test --filter DifferentialTests --no-parallel \
            2>&1 | tee "$RESULTS_DIR/differential.log"

      - name: Stop this run's fixture
        if: always()
        run: |
          if [[ -n "${WINNOW_DATADIR:-}" && -f "$WINNOW_DATADIR/bitcoin.conf" ]]; then
            scripts/signet-fixture down
          fi

      - name: Upload differential evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: node-differential-${{ github.run_id }}
          path: ${{ env.RESULTS_DIR }}/differential.log
          if-no-files-found: error
          retention-days: 14

  ui:
    name: ui-${{ matrix.device }}
    strategy:
      fail-fast: false
      # Pull requests run the iPhone journey on the self-hosted VMs only. The
      # iPad journey — the longest job, on hosted Apple silicon — runs for
      # main pushes, the nightly and confirmed manual runs. The Intel VM's
      # iPad compositor aborts in CA::OGL::push_surface during lifecycle
      # tests, which is why iPad never runs there; iPhone and package lanes
      # retain Intel coverage.
      matrix: >-
        ${{ fromJSON(github.event_name == 'pull_request'
          && '{"include":[{"device":"iPhone","runner":["self-hosted","macOS","btc-swift","node-e2e"]}]}'
          || '{"include":[{"device":"iPhone","runner":["self-hosted","macOS","btc-swift","node-e2e"]},{"device":"iPad","runner":"macos-latest"}]}') }}
    needs: changes
    if: >-
      needs.changes.outputs.required == 'true'
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && (github.event_name != 'pull_request' || github.event.pull_request.base.ref == 'main')
      && (github.event.action != 'edited' || github.event.changes.base != null)
      && (contains('pull_request push schedule', github.event_name) || inputs.confirm_dedicated_fixture)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prepare the hosted Apple silicon fixture tools
        if: matrix.device == 'iPad'
        run: |
          test "$(uname -m)" = arm64
          brew install bitcoin
          bitcoin-cli --version
          sw_vers
          xcodebuild -version

      - name: Stop simulator miners and fixtures left by an interrupted run
        run: |
          xcrun simctl shutdown all || true
          pkill -f WinnowAppUITests-Runner || true
          pkill -f 'bitcoind -datadir=.*/winnow-signet-' || true
          RESULTS_DIR=$(mktemp -d "$RUNNER_TEMP/winnow-evidence-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB-XXXXXX")
          echo "RESULTS_DIR=$RESULTS_DIR" >> "$GITHUB_ENV"
          echo "WINNOW_DATADIR=$RESULTS_DIR/winnow-signet-fixture" >> "$GITHUB_ENV"

      - name: Start this run's isolated fixture
        run: |
          test -d /Applications/Xcode.app/Contents/Developer
          command -v bitcoind
          command -v bitcoin-cli
          command -v bitcoin-util
          test ! -e "$WINNOW_DATADIR"
          for port in "$WINNOW_RPC_PORT" "$WINNOW_P2P_PORT"; do
            if nc -z -G 1 "$WINNOW_NODE_HOST" "$port"; then
              echo "::error::fixture port $port is already occupied"
              exit 1
            fi
          done
          scripts/signet-fixture up
          bitcoin-cli -datadir="$WINNOW_DATADIR" -rpcport="$WINNOW_RPC_PORT" getblockchaininfo \
            | python3 -c 'import json,sys; info=json.load(sys.stdin); assert info["chain"] == "signet" and info["blocks"] == 0, "expected a fresh signet fixture"'

      - name: Python with standard TOML support
        run: |
          if ! brew list --versions python@3.12 >/dev/null 2>&1; then
            brew install python@3.12
          fi
          python_prefix="$(brew --prefix python@3.12)"
          "$python_prefix/bin/python3.12" -c 'import tomllib'
          echo "$python_prefix/libexec/bin" >> "$GITHUB_PATH"

      # The framework changes only when the bridge's locked source or its
      # build script does, and building it from Rust source costs 9–12
      # minutes per job. The key names every input, so a stale framework
      # cannot be restored against changed source; a hit still re-checks the
      # license evidence and the lockfile hash the build recorded.
      - name: Restore the pinned app Tor framework
        id: tor-cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: TorBridge/build
          key: tor-bridge-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('TorBridge/Cargo.lock', 'TorBridge/Cargo.toml', 'TorBridge/rust-toolchain.toml', 'TorBridge/src/**', 'TorBridge/include/**', 'scripts/build-tor-bridge', 'scripts/install-rust') }}

      - name: Build pinned app Tor framework
        if: steps.tor-cache.outputs.cache-hit != 'true'
        run: |
          scripts/install-rust
          export PATH="$HOME/.cargo/bin:$PATH"
          scripts/build-tor-bridge

      - name: Check the restored Tor framework against its locked source
        if: steps.tor-cache.outputs.cache-hit == 'true'
        run: |
          scripts/render-tor-notices --check
          cd TorBridge
          grep ' Cargo.lock$' build/source-and-binary-sha256.txt | shasum -a 256 -c -
          test -d build/WinnowTor.xcframework

      - name: Install pinned XcodeGen
        run: scripts/install-xcodegen

      - name: Generate project and simulator configuration
        run: |
          xcodegen
          echo "SIMULATOR_ID=$(scripts/ios-simulator '${{ matrix.device }}')" >> "$GITHUB_ENV"
          mkdir -p "$RESULTS_DIR/node-screenshots"
          {
            echo "WINNOW_NODE_HOST=$WINNOW_NODE_HOST"
            echo "WINNOW_P2P_PORT=$WINNOW_P2P_PORT"
            echo "WINNOW_RPC_PORT=$WINNOW_RPC_PORT"
            echo "WINNOW_DATADIR=$WINNOW_DATADIR"
            echo "WINNOW_SCREENSHOT_DIR=$RESULTS_DIR/node-screenshots"
          } > "$HOME/.winnow-node.env"

      - name: App UI tests
        run: |
          set -o pipefail
          xcodebuild test -project WinnowApp.xcodeproj -scheme WinnowApp \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/winnow-node-app" \
            -resultBundlePath "$RESULTS_DIR/NodeUI.xcresult" \
            -only-testing:WinnowAppUITests \
            -skipPackagePluginValidation -skipMacroValidation \
            2>&1 | tee "$RESULTS_DIR/node-ui.log"

      - name: Stop simulator miners and remove test configuration
        if: always()
        run: |
          xcrun simctl shutdown all || true
          pkill -f WinnowAppUITests-Runner || true
          rm -f "$HOME/.winnow-node.env"

      - name: Stop this run's fixture
        if: always()
        run: |
          if [[ -n "${WINNOW_DATADIR:-}" && -f "$WINNOW_DATADIR/bitcoin.conf" ]]; then
            scripts/signet-fixture down
          fi

      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: node-ui-${{ matrix.device }}-${{ github.run_id }}
          path: |
            ${{ env.RESULTS_DIR }}/node-ui.log
            ${{ env.RESULTS_DIR }}/NodeUI.xcresult
            ${{ env.RESULTS_DIR }}/node-screenshots/
          if-no-files-found: error
          retention-days: 14
