name: WinnowApp
options:
  bundleIdPrefix: com.btcswift
  deploymentTarget:
    iOS: "17.0"

# The app and development tools build the library from this checkout.
packages:
  Winnow:
    path: .
  # Linked directly by the UI-test target (the shared signet miner signs
  # block challenges with P256K).
  swift-secp256k1:
    url: https://github.com/21-DOT-DEV/swift-secp256k1
    exactVersion: 0.23.2

targets:
  WinnowApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    entitlements:
      path: build/WinnowApp.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.btcswift.app
        com.apple.developer.icloud-services:
          - CloudKit
    info:
      path: build/WinnowApp-Info.plist
      properties:
        LSMinimumSystemVersion: "14.0"
        NSLocalNetworkUsageDescription: "Winnow checks your Tailscale gateways and connects to Bitcoin nodes you configure."
        # Background chain checks (BackgroundSyncScheduler). iOS decides when
        # they run; each is one bounded scan with the foreground's routing.
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers:
          - com.btcswift.winnow.chain-refresh
          - com.btcswift.winnow.chain-processing
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          # The census I2P mirror (CensusCatalog.i2pMirror) speaks plain HTTP:
          # I2P encrypts and authenticates the tunnel to the destination, and
          # the census carries its own publisher signature. User-approved
          # 2026-09-28 for this one host only.
          NSExceptionDomains:
            yts2d2oyrsz2eytnofuutgnsixymdkj2nmcmmpfv3aofzsnjt4eq.b32.i2p:
              NSExceptionAllowsInsecureHTTPLoads: true
    sources:
      - path: Sources/WinnowApp
        excludes: ["README.md"]
      # Design papers, bundled so Settings can render them offline (the
      # esplora opt-in warning links the read-side paper). These are the same
      # files the website serves; site.css rides along so they keep their type.
      - path: docs/site.css
        buildPhase: resources
      - path: docs/mobile.html
        buildPhase: resources
      - path: docs/read-side.html
        buildPhase: resources
      - path: docs/write-side.html
        buildPhase: resources
      - path: docs/vaults.html
        buildPhase: resources
      - path: docs/import.html
        buildPhase: resources
    dependencies:
      - package: Winnow
        product: WalletCore
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.btcswift.app
        PRODUCT_NAME: WinnowApp
        TARGETED_DEVICE_FAMILY: "1,2" # iPhone and iPad; same iOS app on Apple silicon Mac
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: "2858MX5336" # ttt246 llc
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        "INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad": "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleDisplayName: Winnow
        # Standard/exempt crypto only (CryptoKit, libsecp256k1) — no export
        # compliance prompt per build.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # Signing, seed export/reveal, and destructive key operations
        # authenticate the device owner; Face ID may satisfy that prompt.
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Face ID confirms it's you before Winnow signs or reveals wallet secrets."
        # A custom Esplora explorer can live on the local network (a home
        # node over plain HTTP); cleartext stays off the public internet.
        # Nested ATS keys are generated by `info.properties` above. A flat
        # INFOPLIST_KEY_NSAppTransportSecurity_* setting is not emitted by Xcode.
        # Sync-while-active by design: no UIBackgroundModes.
        CODE_SIGN_STYLE: Automatic

  # Winnow Lightning: a separate app with its own bundle, Keychain and files.
  # It compiles the same wallet sources with the LIGHTNING condition, whose
  # hooks call into Sources/WinnowLightningApp, and it alone links
  # LightningCore. No iCloud: its recovery is the encrypted Lightning file.
  WinnowLightning:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    info:
      path: build/WinnowLightning-Info.plist
      properties:
        LSMinimumSystemVersion: "14.0"
        NSLocalNetworkUsageDescription: "Winnow checks your Tailscale gateways and connects to Bitcoin nodes you configure."
        # Scanning fills the invoice field; it never approves a payment.
        NSCameraUsageDescription: Scan a payment invoice.
        # Background chain checks (BackgroundSyncScheduler) also watch the
        # channels and relay their pre-signed recovery transactions.
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers:
          - com.btcswift.winnow.chain-refresh
          - com.btcswift.winnow.chain-processing
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          # The census I2P mirror, as for WinnowApp above.
          NSExceptionDomains:
            yts2d2oyrsz2eytnofuutgnsixymdkj2nmcmmpfv3aofzsnjt4eq.b32.i2p:
              NSExceptionAllowsInsecureHTTPLoads: true
    sources:
      - path: Sources/WinnowApp
        excludes: ["README.md"]
      - path: Sources/WinnowLightningApp
      # The same offline design papers as WinnowApp.
      - path: docs/site.css
        buildPhase: resources
      - path: docs/mobile.html
        buildPhase: resources
      - path: docs/read-side.html
        buildPhase: resources
      - path: docs/write-side.html
        buildPhase: resources
      - path: docs/vaults.html
        buildPhase: resources
      - path: docs/import.html
        buildPhase: resources
    dependencies:
      - package: Winnow
        product: WalletCore
      - package: Winnow
        product: LightningCore
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.btcswift.lightning
        PRODUCT_NAME: WinnowLightning
        TARGETED_DEVICE_FAMILY: "1,2" # iPhone and iPad; same iOS app on Apple silicon Mac
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        SWIFT_VERSION: "6.0"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) LIGHTNING"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: "2858MX5336" # ttt246 llc
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        "INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad": "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleDisplayName: Winnow Lightning
        # Noise/onion cryptography includes implementations outside Apple's
        # OS. Resolve this app's declaration in App Store Connect; do not
        # inherit the ordinary wallet's exemption automatically.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: YES
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Face ID confirms it's you before Winnow signs or reveals wallet secrets."
        CODE_SIGN_ENTITLEMENTS: Resources/WinnowLightning.entitlements
        CODE_SIGN_STYLE: Automatic

  # Unit tests, hosted in the app. TestSupport carries the shared fixtures
  # (temp files, wallet and vault builders, the fake segwit transaction).
  WinnowAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AppTests
        # AppTests/Lightning runs in WinnowLightningTests below.
        excludes: ["README.md", "Lightning/**"]
      # macOS may not record Data Protection classes. Run the same assertions
      # in the iOS app host, where file attributes can be read back.
      - path: Tests/WalletCoreTests/FileProtectionTests.swift
    dependencies:
      - target: WinnowApp
      - package: Winnow
        product: TestSupport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.btcswift.app.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/WinnowApp.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/WinnowApp"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "2858MX5336"

  # One iPhone UI journey (XCUITest) receives, sends and confirms for an
  # ordinary wallet, MuSig2 and 2-of-3 on local custom signet, with run artifacts.
  # Node access (bitcoin-cli mining/funding) happens from
  # the macOS test-runner process. The miner and RPC helpers live in the
  # package's TestSupport library (Tests/Support), whose process and key
  # parsing helpers are covered by the ordinary SwiftPM unit tests.
  WinnowAppUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UITests
        # The Lightning journeys drive WinnowLightning (WinnowLightningUITests).
        excludes: ["README.md", "Lightning/**"]
    dependencies:
      - target: WinnowApp
      - package: Winnow
        product: TestSupport
      - package: Winnow
        product: WalletCore
      - package: swift-secp256k1
        product: P256K
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.btcswift.app.uitests
        TEST_TARGET_NAME: WinnowApp
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "2858MX5336" # ttt246 llc

  # Lightning unit tests, hosted in WinnowLightning. TestSupport.swift is the
  # same fixture file WinnowAppTests compiles; LIGHTNING picks its host module.
  WinnowLightningTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AppTests/Lightning
      - path: AppTests/TestSupport.swift
    dependencies:
      - target: WinnowLightning
      - package: Winnow
        product: TestSupport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.btcswift.lightning.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/WinnowLightning.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/WinnowLightning"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_VERSION: "6.0"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) LIGHTNING"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "2858MX5336"

  # Lightning UI journeys against real CLN/LDK peers (scripts provide the
  # fixture), plus the receive/setup screens that need none. The shared
  # helpers are the same file WinnowAppUITests compiles.
  WinnowLightningUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UITests/Lightning/LightningAppUITests.swift
      - path: UITests/TestHelpers.swift
    dependencies:
      - target: WinnowLightning
      - package: Winnow
        product: TestSupport
      - package: Winnow
        product: WalletCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.btcswift.lightning.uitests
        TEST_TARGET_NAME: WinnowLightning
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "2858MX5336" # ttt246 llc

schemes:
  WinnowApp:
    build:
      targets:
        WinnowApp: all
        WinnowAppUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      # Coverage for every target, including the WalletCore package, so the
      # CRAP gate (docs/crap.md) sees what app tests and the journey reach.
      gatherCoverageData: true
      # ci-ui-journey records one continuous video; avoid a second encoder.
      captureScreenshotsAutomatically: false
      preferredScreenCaptureFormat: screenshots
      targets:
        - WinnowAppTests
        - WinnowAppUITests
  WinnowLightning:
    build:
      targets:
        WinnowLightning: all
        WinnowLightningUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      captureScreenshotsAutomatically: false
      preferredScreenCaptureFormat: screenshots
      targets:
        - WinnowLightningTests
        - WinnowLightningUITests
    archive:
      config: Release
