name = "WinnowProofs"
defaultTargets = ["WinnowProofs", "emit"]

# Mathlib v4.35.0, pinned by commit; lake-manifest.json pins its dependencies.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "56a005855ea17e0b0958f73ec801ae140b0a1679"

[[lean_lib]]
name = "WinnowProofs"

# Writes the generated Swift; see README.md.
[[lean_exe]]
name = "emit"
root = "Emit"
